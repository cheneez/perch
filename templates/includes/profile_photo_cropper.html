{# Expects: file_input_id default id_profile_picture, optional modal_id #}
{% with mid=modal_id|default:"profilePhotoModal" %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<div class="modal fade" id="{{ mid }}" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Adjust photo</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="cropper-wrap" style="max-height: 60vh;">
          <img id="{{ mid }}Img" src="" alt="" style="max-width: 100%; display: block;">
        </div>
        <div class="d-flex gap-2 mt-3 align-items-center">
          <button type="button" class="btn btn-outline-secondary btn-sm" id="{{ mid }}ZoomOut" aria-label="Zoom out">−</button>
          <button type="button" class="btn btn-outline-secondary btn-sm" id="{{ mid }}ZoomIn" aria-label="Zoom in">+</button>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="{{ mid }}Save">Save crop</button>
      </div>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
(function() {
  var fileInputId = '{{ file_input_id|default:"id_profile_picture" }}';
  var modalId = '{{ mid }}';
  var fileInput = document.getElementById(fileInputId);
  if (!fileInput) return;
  var modalEl = document.getElementById(modalId);
  var imgEl = document.getElementById(modalId + 'Img');
  var cropper = null;
  var modal = modalEl ? new bootstrap.Modal(modalEl) : null;

  function destroyCropper() {
    if (cropper) {
      cropper.destroy();
      cropper = null;
    }
    if (imgEl.src && imgEl.src.indexOf('blob:') === 0) {
      URL.revokeObjectURL(imgEl.src);
    }
    imgEl.src = '';
  }

  fileInput.addEventListener('change', function() {
    var f = fileInput.files && fileInput.files[0];
    if (!f || !modal) return;
    destroyCropper();
    imgEl.src = URL.createObjectURL(f);
    modal.show();
    imgEl.onload = function() {
      if (cropper) cropper.destroy();
      cropper = new Cropper(imgEl, {
        aspectRatio: 1,
        viewMode: 1,
        dragMode: 'move',
        autoCropArea: 1,
        movable: true,
        zoomable: true,
      });
    };
  });

  modalEl.addEventListener('hidden.bs.modal', function() {
    destroyCropper();
  });

  document.getElementById(modalId + 'ZoomIn').addEventListener('click', function() {
    if (cropper) cropper.zoom(0.1);
  });
  document.getElementById(modalId + 'ZoomOut').addEventListener('click', function() {
    if (cropper) cropper.zoom(-0.1);
  });

  document.getElementById(modalId + 'Save').addEventListener('click', function() {
    if (!cropper) return;
    var canvas = cropper.getCroppedCanvas({ width: 400, height: 400, imageSmoothingQuality: 'high' });
    if (!canvas) return;
    canvas.toBlob(function(blob) {
      if (!blob) return;
      var name = (fileInput.files[0] && fileInput.files[0].name) || 'profile.jpg';
      if (!/\.(jpe?g|png|webp)$/i.test(name)) name = 'profile.jpg';
      var file = new File([blob], name.replace(/\.\w+$/, '.jpg'), { type: 'image/jpeg' });
      var dt = new DataTransfer();
      dt.items.add(file);
      fileInput.files = dt.files;
      modal.hide();
    }, 'image/jpeg', 0.92);
  });
})();
</script>
{% endwith %}
