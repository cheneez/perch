<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Perch — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #f5f5f3; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: white; border-radius: 16px; padding: 48px; max-width: 500px; width: 100%; text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
  h1 { font-family: 'Playfair Display', serif; font-size: 32px; color: #0f1f4b; margin-bottom: 8px; }
  .badge { display: inline-block; padding: 8px 20px; border-radius: 20px; font-size: 14px; font-weight: 500; margin: 16px 0 24px; }
  .student { background: rgba(15,31,75,0.08); color: #0f1f4b; }
  .realtor { background: rgba(181,151,90,0.15); color: #8a6d2f; }
  .info { background: #f5f5f3; border-radius: 10px; padding: 20px; margin-bottom: 24px; text-align: left; }
  .info-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 14px; }
  .info-row:last-child { border-bottom: none; }
  .info-label { color: #999; }
  .info-value { color: #0f1f4b; font-weight: 500; }
  .logout { display: inline-block; padding: 12px 32px; background: #0f1f4b; color: white; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 500; }
</style>
</head>
<body>
<div class="card">
  <h1>Welcome, {{ user.first_name }}! 👋</h1>
  <div class="badge {{ user_type }}">
    {% if user_type == 'student' %}🎓 Student Account{% else %}🏢 Realtor Account{% endif %}
  </div>
  <div class="info">
    <div class="info-row"><span class="info-label">Name</span><span class="info-value">{{ user.first_name }} {{ user.last_name }}</span></div>
    <div class="info-row"><span class="info-label">Email</span><span class="info-value">{{ user.email }}</span></div>
    <div class="info-row"><span class="info-label">Account Type</span><span class="info-value">{{ user_type|capfirst }}</span></div>
    <div class="info-row"><span class="info-label">BC Verified</span><span class="info-value">✅ Yes</span></div>
  </div>
  <a href="/auth/logout/" class="logout">Log Out</a>
</div>
</body>
</html>
